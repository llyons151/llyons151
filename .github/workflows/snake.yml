name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/snake.py ${{ github.repository_owner }} dist
        env:
          # SNAKE_TOKEN (a personal token) lets the grid include private-repo contributions
          GITHUB_TOKEN: ${{ secrets.SNAKE_TOKEN || github.token }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

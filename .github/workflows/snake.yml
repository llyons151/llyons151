name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # SNAKE_TOKEN (a personal token) lets the grid include private-repo contributions
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/snake.svg?color_snake=#1f6feb&color_dots=#ebedf0,#cae8ff,#79c0ff,#388bfd,#1158c7
            dist/snake-dark.svg?palette=github-dark&color_snake=#79c0ff&color_dots=#161b22,#0d2847,#0f4a8a,#1f6feb,#58a6ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
